name: Build OrangeFox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Prepare environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison gperf build-essential python-is-python3 zip curl zlib1g-dev libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig libncurses5-dev ccache bc rsync
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Setup Git
      run: |
        git config --global user.name "Your Name"
        git config --global user.email "your.email@example.com"

    - name: Sync OrangeFox
      run: |
        mkdir -p ~/fox
        cd ~/fox
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch 12.1 --path ~/fox
        
    - name: Clone device tree
      run: |
        mkdir -p ~/fox/device/xiaomi/aurora
        cp -r $GITHUB_WORKSPACE/* ~/fox/device/xiaomi/aurora/

    - name: Build
      run: |
        cd ~/fox
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch twrp_aurora-eng
        mka recoveryimage

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-aurora
        path: |
          ~/fox/out/target/product/aurora/recovery.img
          ~/fox/out/target/product/aurora/OrangeFox*.zip
